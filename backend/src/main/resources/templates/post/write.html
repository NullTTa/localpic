<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>LocalPick - 글쓰기</title>
</head>
<body>
<form th:action="@{/posts/new}" th:object="${form}" method="post" enctype="multipart/form-data">
    <select th:field="*{postType}">
        <option value="DAILY">일상</option>
        <option value="PROMOTION">홍보</option>
        <option value="EVENT">이벤트</option>
    </select>
    <textarea th:field="*{content}" rows="6"></textarea>
    <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
    이벤트 시작 <input type="date" th:field="*{eventStartDate}">
    이벤트 종료 <input type="date" th:field="*{eventEndDate}">
    <input type="file" name="image" accept="image/*">
    <button type="submit">등록</button>
</form>
</body>
</html>
