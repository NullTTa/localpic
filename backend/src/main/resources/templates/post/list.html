<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>LocalPick - 피드</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="top">
    <a th:href="@{/posts}" class="logo">LocalPick</a>
    <a th:href="@{/posts/new}">글쓰기</a>
</header>
<nav class="tabs">
    <a th:href="@{/posts}">전체</a>
    <a th:href="@{/posts(type='PROMOTION')}">홍보</a>
    <a th:href="@{/posts(type='EVENT')}">이벤트</a>
</nav>
<main>
    <article class="card" th:each="post : ${posts.content}">
        <div class="writer" th:text="${post.writer.nickname}">작성자</div>
        <img th:if="${post.imageUrl}" th:src="${post.imageUrl}" alt="">
        <p th:text="${post.content}">내용</p>
        <a th:href="@{/posts/{id}(id=${post.id})}">
            ♥ <span th:text="${post.likeCount}">0</span> · 댓글 <span th:text="${post.commentCount}">0</span>
        </a>
    </article>
    <div class="paging">
        <a th:if="${posts.page > 0}" th:href="@{/posts(page=${posts.page - 1}, type=${type})}">이전</a>
        <a th:if="${posts.hasNext}" th:href="@{/posts(page=${posts.page + 1}, type=${type})}">다음</a>
    </div>
</main>
</body>
</html>
