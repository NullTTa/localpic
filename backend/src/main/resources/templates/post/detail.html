<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>LocalPick - 게시물</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main>
    <article class="card">
        <div class="writer" th:text="${post.writer.nickname}">작성자</div>
        <img th:if="${post.imageUrl}" th:src="${post.imageUrl}" alt="">
        <p th:text="${post.content}">내용</p>
        <p>조회 <span th:text="${post.viewCount}">0</span></p>
        <form th:action="@{/posts/{id}/like(id=${post.id})}" method="post">
            <button type="submit" th:text="${post.liked} ? '♥ 좋아요 취소' : '♡ 좋아요'">좋아요</button>
            <span th:text="${post.likeCount}">0</span>
        </form>
    </article>
    <a th:href="@{/posts}">목록으로</a>
</main>
</body>
</html>
