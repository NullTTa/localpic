spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

server:
  port: 8080
  servlet:
    session:
      timeout: 60m

app:
  upload-dir: ./uploads
  cors-origin: http://localhost:5173

---
# 개발용: H2 메모리 DB + 샘플 데이터 자동 생성
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:localpick;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false

---
# 배포용: MySQL (비밀번호는 환경변수로 주입)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/localpick?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
